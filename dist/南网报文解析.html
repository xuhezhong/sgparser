// 字段解码：按 Field 定义把一段字节解成树节点（Node）。纯函数，不接触 DOM。
// 字节序（design.md §5.4，均已用真实报文核实）：
//   数值、地址、密码、BIN，以及数据内容里的时间字段：低字节在前，显示时倒序；
//   时间域（order:'be'，如起止时间、数据时间）与 ASCII：高位在前。

const hex2 = (b) => b.toString(16).toUpperCase().padStart(2, '0');
const TIME_TOKENS = /YYYY|YY|MM|DD|hh|HH|mm|ss|WW/g;

function rawOf(bytes, off, len) {
  return Array.from(bytes.subarray(off, off + len), hex2).join(' ');
}

// 按显示顺序（高位在左）取字节
function displayBytes(bytes, off, len, order) {
  const arr = Array.from(bytes.subarray(off, off + len));
  return order === 'be' ? arr : arr.reverse();
}

// 字段的固定字节数；含 'var' 或 repeat 时返回 null
function fixedLen(f) {
  if (f.enc === 'repeat') return null;
  if (f.enc === 'struct' && typeof f.bytes !== 'number') {
    let sum = 0;
    for (const c of f.fields || []) {

      if (n === null) return null;
      sum += n;
    }
    return sum;

function hasShortage(node) {
  return (node.error || '').startsWith('数据不足') || (node.children || []).some(hasShortage);

function bcdValue(d, f) {
  let s = d.map(hex2).join('');
  let neg = false;
  if (f.sign === 'msb') {

    neg = (top & 8) !== 0;
    s = String(top & 7) + s.slice(1);

function bitNodes(v, bits, off, len) {
  return bits.map((b) => {
    const [hi, lo = hi] = String(b.bit).split('-').map(Number);
    const width = hi - lo + 1;

// 8 字节通信地址：倒序后依次为 补位 2 + IP 4 + 端口 2（仓库样例 IP 查询应答实测）
function ipValue(d) {

function expandRepeat(f, siblings) {

function decodeStruct(bytes, off, f, end) {

  return node;

  const ok = r.list ? r.list.includes(v) : v >= r.lo && v <= r.hi;
  return ok ? v : null;
}

function rangeName(r, v) {
  const h = v.toString(16).toUpperCase().padStart(2, '0');
  if (r.names && r.names[h] !== undefined) return r.names[h];
  const n = v - (r.offset || 0);
  return r.tpl.replace('{n}', String(n)).replace('{h}', n.toString(16).toUpperCase().padStart(2, '0'));
}

function resolveDef(def) {
  if (!def.struct) return def;
  const s = DICT.structs[def.struct];
  const bytes = typeof def.bytes === 'number' ? def.bytes : s && typeof s.bytes === 'number' ? s.bytes : 'var';
  return { ...def, fields: s ? s.fields : [], bytes };
}

function lookupDI(di) {
  const key = String(di).toUpperCase();
  if (diCache.has(key)) return diCache.get(key);
  let def = null;
  if (DICT.items[key]) def = { di: key, ...DICT.items[key] };
  else {
    for (const r of DICT.ranges) {
      const v = rangeValue(r, key);
      if (v !== null) {
        def = { di: key, ...r.def, name: rangeName(r, v) };
        break;
      }
    }
  }
  if (def) def = resolveDef(def);
  diCache.set(key, def);
  return def;
}

// ---- frame.js ----
// 帧层：清洗输入、拆帧头（68 L L 68 C A AFN SEQ）、定位附加信息（PW/Tp）、校验 CS 与结束符。
// 依据规约第 5 章、6.1 节（design.md §2.1、§5.2）。

// 规约表 6-1：应用层功能码
const AFN_NAMES = {
  0x00: '确认/否认', 0x02: '链路接口检测', 0x04: '写参数', 0x06: '安全认证', 0x0a: '读参数', 0x0c: '读当前数据',
  0x0d: '读历史数据', 0x0e: '读事件记录', 0x0f: '文件传输', 0x10: '中继转发', 0x12: '读任务数据', 0x13: '读告警数据',
  0x15: '用户自定义数据', 0x20: '终端请求主站数据',
};
// 规约表 5-2（PRM=0）、表 5-1（PRM=1）：链路层功能码，下标为 PRM
const FUNC_NAMES = [
  { 0: '确认：认可', 8: '响应：用户数据', 9: '响应：否认，无所召唤的数据', 11: '响应：链路状态' },
  { 1: '发送/确认：复位命令', 4: '发送/无回答：用户数据', 9: '请求/响应：链路测试', 10: '请求/响应：请求 1 级数据', 11: '请求/响应：请求 2 级数据' },
];
// 规约表 6-2：下标 = FIR*2 + FIN
const FRAME_KINDS = ['多帧：中间帧', '多帧：结束帧', '多帧：第 1 帧，有后续帧', '单帧'];
const MAX_L = 16383;
// 规约 6.1.8：Tp = 启动帧发送时标 DDhhmmss（4，低字节在前）+ 允许发送传输延时（BIN 1，分钟）
const TP_FIELD = { name: '时间标签Tp', enc: 'struct', desc: '时间标签 Tp（规约 6.1.8）', fields: [
  { name: '启动帧发送时标', bytes: 4, enc: 'time', fmt: 'DDhhmmss' },
  { name: '允许发送传输延时', bytes: 1, enc: 'bin', unit: '分钟' },
] };

const hexOf = (b) => b.toString(16).toUpperCase().padStart(2, '0');
// 规约 6.2.3、6.2.4：下行写参数、下行/上行安全认证带 PW
const needsPW = (dir, afn) => (dir === 0 && (afn === 0x04 || afn === 0x06)) || (dir === 1 && afn === 0x06);

function flagNode(name, off, value, desc) {
  return { name, offset: off, length: 1, raw: '', value: String(value), desc };
}

function cleanHex(text) {
  const src = String(text ?? '').replace(/0x/gi, '  ');
  const bad = src.search(/[^0-9a-fA-F\s,;，；]/);
  if (bad >= 0) return { error: `第 ${bad + 1} 个字符「${src[bad]}」不是十六进制字符` };
  const s = src.replace(/[\s,;，；]/g, '');
  if (s.length % 2) return { error: `十六进制字符数为 ${s.length}，不是偶数` };
  const bytes = new Uint8Array(s.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(s.slice(i * 2, i * 2 + 2), 16);
  return { bytes };
}

function describeCtrl(c, cv, fi) {
  fi.dir = cv >> 7;
  fi.prm = (cv >> 6) & 1;
  const d5 = (cv >> 5) & 1;
  const d4 = (cv >> 4) & 1;
  const func = cv & 0x0f;
  const funcName = FUNC_NAMES[fi.prm][func];
  c.children = [
    flagNode('D7传输方向位DIR', 6, fi.dir, fi.dir ? '上行：终端发出' : '下行：主站发出'),
    flagNode('D6启动标志位PRM', 6, fi.prm, fi.prm ? '来自启动站' : '来自从动站'),
    fi.dir
      ? flagNode('D5要求访问位ACD', 6, d5, d5 ? '终端有告警数据等待访问' : '终端无告警数据等待访问')
      : flagNode('D5帧计数位FCB', 6, d5, `FCB=${d5}`),
    fi.dir ? flagNode('D4保留', 6, d4, '保留') : flagNode('D4帧计数有效位FCV', 6, d4, d4 ? 'FCB 有效' : 'FCB 无效'),
    flagNode('D3~D0功能码', 6, func, funcName ? `${func}：${funcName}` : `${func}：规约备用`),
  ];
  if (!funcName) c.children[4].error = `PRM=${fi.prm} 时功能码 ${func} 为规约备用`;
  c.desc = `${fi.dir ? '上行' : '下行'}，${fi.prm ? '启动站' : '从动站'}，${funcName || '备用功能码'}`;
}

function describeAddr(a, bytes, fi) {
  const rev = (off) => Array.from(bytes.subarray(off, off + 3)).reverse().map(hexOf).join('');
  const [a1, a2, a3] = a.children;
  const a2v = bytes[10] | (bytes[11] << 8) | (bytes[12] << 16);
  fi.cid = rev(7) + rev(10);
  fi.a3 = bytes[13];
  a.value = fi.cid;
  a.desc = `集中器ID(cid)：${fi.cid}`;
  if (!a1.error) a1.desc = `省地市区县码：${rev(7)}`;
  a2.desc = `终端地址：${a2v}（${rev(10)}H）${a2v === 0 ? '，无效地址' : a2v === 0xffffff ? '，系统广播地址' : ''}`;
  a3.desc = `主站地址 MSA=${fi.a3}`;
}

function describeSeq(seq, sv, fi) {
  fi.seq = sv;
  const tpv = sv >> 7;
  const fir = (sv >> 6) & 1;
  const fin = (sv >> 5) & 1;
  const con = (sv >> 4) & 1;
  fi.frameKind = FRAME_KINDS[fir * 2 + fin];
  seq.children = [
    flagNode('D7帧时间标签有效位TpV', 15, tpv, tpv ? '帧末尾带时间标签 Tp' : '帧末尾无时间标签 Tp'),
    flagNode('D6首帧标志FIR', 15, fir, fir ? '报文的第一帧' : '不是报文的第一帧'),
    flagNode('D5末帧标志FIN', 15, fin, fin ? '报文的最后一帧' : '不是报文的最后一帧'),
    flagNode('D4请求确认标志CON', 15, con, con ? '需要对该帧报文进行确认' : '不需要确认'),
    flagNode('D3~D0帧内序号', 15, sv & 0x0f, `帧内序号=${sv & 0x0f}`),
  ];
  seq.desc = `${fi.frameKind}，帧内序号=${sv & 0x0f}`;
}

function tailNodes(bytes, L) {
  const out = [];
  const cs = decodeField(bytes, 6 + L, { name: '校验码CS', bytes: 1, enc: 'hex' });
  const calc = bytes.subarray(6, 6 + L).reduce((s, b) => s + b, 0) & 0xff;
  if (calc === bytes[6 + L]) cs.desc = '校验码正确';
  else cs.error = cs.desc = `校验码错误：报文 ${cs.raw}，计算应为 ${hexOf(calc)}`;
  const e = decodeField(bytes, 7 + L, { name: '结束符16H', bytes: 1, enc: 'hex' });
  if (bytes[7 + L] === 0x16) e.desc = '结束符';
  else e.error = e.desc = `应为 16，实际 ${e.raw}`;
  out.push(cs, e);
  if (bytes.length > L + 8) {
    const x = decodeField(bytes, L + 8, { name: '多余数据', bytes: bytes.length - L - 8, enc: 'hex', order: 'be' });
    x.error = x.desc = `帧结束后多出 ${x.length} 字节`;
    out.push(x);
  }
  return out;
}

function parseFrame(bytes) {
  const n = bytes.length;
  const nodes = [];
  const fi = { nodes, dir: 0, prm: 0, afn: -1, seq: 0, unitStart: 16, unitEnd: 16, fatal: false, cid: '', a3: 0, frameKind: '', afnName: '' };
  // 依次拆帧头；某一段字节不足即判为 fatal，不再往下拆（R6.2）
  const step = (off, f) => {
    if (fi.fatal) return null;
    const nd = decodeField(bytes, off, f);
    nodes.push(nd);
    const short = (x) => (x.error || '').startsWith('数据不足');
    if (short(nd) || (nd.children || []).some(short)) {
      fi.fatal = true;
      return null;
    }
    return nd;
  };
  const s1 = step(0, { name: '起始符68H', bytes: 1, enc: 'hex' });
  const l1 = step(1, { name: '长度L', bytes: 2, enc: 'bin' });
  const l2 = step(3, { name: '长度L', bytes: 2, enc: 'bin' });
  const s2 = step(5, { name: '起始符68H', bytes: 1, enc: 'hex' });
  const c = step(6, { name: '控制域C', bytes: 1, enc: 'hex' });
  const a = step(7, { name: '地址域A', enc: 'struct', fields: [
    { name: '省地市区县码A1', bytes: 3, enc: 'bcd' },
    { name: '终端地址A2', bytes: 3, enc: 'bin' },
    { name: '主站地址A3', bytes: 1, enc: 'bin' },
  ] });
  const afn = step(14, { name: '功能码AFN', bytes: 1, enc: 'hex' });
  const seq = step(15, { name: '帧序列域SEQ', bytes: 1, enc: 'hex' });

  const L = n >= 3 ? bytes[1] | (bytes[2] << 8) : 0;
  if (s1 && bytes[0] !== 0x68) s1.error = `应为 68，实际 ${s1.raw}`;
  if (l1) {
    l1.desc = `用户数据长度 L=${L}，整帧应为 ${L + 8} 字节`;
    if (L > MAX_L) l1.error = `L=${L} 超过规约上限 ${MAX_L}`;
    else if (L < 10) l1.error = `L=${L} 小于最小长度 10（C + A + AFN + SEQ）`;
    else if (n < L + 8) l1.error = `整帧应为 ${L + 8} 字节，实际 ${n} 字节（报文不完整）`;
  }
  if (l2) {
    const L2 = bytes[3] | (bytes[4] << 8);
    l2.desc = `用户数据长度 L=${L2}`;
    if (L2 !== L) l2.error = `两个长度 L 不一致（${L} ≠ ${L2}）`;
  }
  if (s2 && bytes[5] !== 0x68) s2.error = `应为 68，实际 ${s2.raw}`;
  if (c) describeCtrl(c, bytes[6], fi);
  if (a) describeAddr(a, bytes, fi);
  if (afn) {
    fi.afn = bytes[14];
    fi.afnName = AFN_NAMES[fi.afn] || '规约未定义';
    afn.desc = fi.afnName;
  }
  if (seq) describeSeq(seq, bytes[15], fi);
  if (fi.fatal) return fi;

  // 帧尾与附加信息：只有整帧完整时才定位；Tp 在最后，PW 紧挨在 Tp 之前（规约图 6-1）
  const complete = L >= 10 && L <= MAX_L && n >= L + 8;
  let auxEnd = complete ? 6 + L : n;
  if (complete) {
    nodes.push(...tailNodes(bytes, L));
    if (fi.seq >> 7) {
      if (auxEnd - 5 >= 16) {
        fi.tp = decodeField(bytes, auxEnd - 5, TP_FIELD, auxEnd);
        auxEnd -= 5;
      } else seq.children[0].error = '帧长度不足以容纳 Tp';
    }
    if (needsPW(fi.dir, fi.afn)) {
      if (auxEnd - 16 >= 16) {
        fi.pw = decodeField(bytes, auxEnd - 16, { name: '消息验证码PW', bytes: 16, enc: 'hex', order: 'be' }, auxEnd);
        fi.pw.desc = '消息认证码 PW（规约 6.1.7）';
        auxEnd -= 16;
      } else afn.error = '帧长度不足以容纳 PW';
    }
  }
  fi.unitEnd = Math.max(16, auxEnd);
  return fi;
}

// ---- unit.js ----
// 信息体：按「AFN × 方向」规则拆 DA + DI + 内容/时间域（规约 6.2 节，design.md §5.3）。

// DI 之后跟什么：[下行, 上行]
const AFN_RULES = {
  0x00: ['result', 'result'],
  0x02: ['content', 'content'],
  0x04: ['content', 'err'],
  0x06: ['content', 'content'],
  0x0a: ['none', 'content'],
  0x0c: ['none', 'content'],
  0x0d: ['range6+density', 'content+time6*'],
  0x0e: ['range6', 'content'],
  0x0f: ['content', 'errOrContent'],
  0x10: ['content', 'content'],
  0x12: ['range6+density', 'content+time5*'],
  0x13: ['range6', 'content'],
  0x15: ['content', 'content'],
  0x20: ['content', 'none'],
};
// 规约附录中出现过的 DI3，加上平台自有 DI 的前缀（10/11/F0/F2）；用于区分「未收录 DI」与「规约外数据」
const KNOWN_DI3 = new Set([0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x1f, 0xe0, 0xe1, 0xe2, 0xe3, 0x10, 0x11, 0xf0, 0xf2]);
// 规约表 6-5：数据密度
const DENSITY = { '00': '终端历史数据存储密度', '01': '1 分钟', '02': '5 分钟', '03': '15 分钟', '04': '30 分钟', '05': '60 分钟', '06': '1 日', '07': '1 月', '08': '结算日' };
const TIME_DOMAIN6 = { bytes: 6, enc: 'time', fmt: 'YYYYMMDDhhmm', order: 'be' }; // 规约 6.1.6
const TIME_DOMAIN5 = { bytes: 5, enc: 'time', fmt: 'YYMMDDhhmm', order: 'be' }; // 附录 A.10.4，读任务应答实测

function diAt(bytes, off) {
  let s = '';
  for (let i = 3; i >= 0; i--) s += bytes[off + i].toString(16).toUpperCase().padStart(2, '0');
  return s;
}

function plausibleDA(a1, a2) {
  return (a1 === 0 && a2 === 0) || (a1 === 0xff && a2 === 0xff) || (a1 !== 0 && a2 >= 1 && a2 <= 0xfe);
}

function isKnownUnit(bytes, off, end) {
  return end - off >= 6 && lookupDI(diAt(bytes, off + 2)) !== null;
}

// design §5.3 规则 3、4：此处能否开始一个新的信息体
function unitStartsAt(bytes, off, end) {
  if (end - off < 6) return false;
  if (isKnownUnit(bytes, off, end)) return true;
  return KNOWN_DI3.has(bytes[off + 5]) && plausibleDA(bytes[off], bytes[off + 1]);
}

function hasError(node) {
  return Boolean(node.error) || (node.children || []).some(hasError);
}

function shortIn(node) {
  return (node.error || '').startsWith('数据不足') || (node.children || []).some(shortIn);
}

function rawRest(bytes, off, end, name, desc) {
  const nd = decodeField(bytes, off, { name, bytes: end - off, enc: 'hex', order: 'be' }, end);
  nd.desc = desc;
  return nd;
}

function daNode(bytes, off) {
  const nd = decodeField(bytes, off, { name: '信息点标识DA', bytes: 2, enc: 'hex', order: 'be' });
  const a1 = bytes[off];
  const a2 = bytes[off + 1];
  if (a1 === 0 && a2 === 0) {
    nd.value = 'p0';
    nd.desc = 'p0：终端';
  } else if (a1 === 0xff && a2 === 0xff) {
    nd.value = 'pALL';
    nd.desc = '除终端外的全部测量点';
  } else if (!plausibleDA(a1, a2)) {
    nd.error = nd.desc = `DA 非法（DA1=${nd.raw.slice(0, 2)}，DA2=${nd.raw.slice(3)}）`;
  } else {
    const pn = [];
    for (let b = 0; b < 8; b++) if (a1 & (1 << b)) pn.push(8 * (a2 - 1) + b + 1);
    nd.value = pn.map((p) => `p${p}`).join(',');
    nd.desc = `Pn=${pn.join(',')}（代码点号 ${pn.map((p) => p - 1).join(',')}）`;
  }
  return nd;
}

function errNode(bytes, off, end) {
  const nd = decodeField(bytes, off, { name: '错误码ERR', bytes: 1, enc: 'hex' }, end);
  if (!nd.error) nd.desc = `${nd.value}：${ERR_CODES[nd.value] ?? '规约未定义错误码'}`;
  return nd;
}

function fieldsFor(def, dir) {
  return (dir === 1 && def.up ? def.up : def.fields) || [];
}

function contentNode(bytes, off, end, def, dir) {
  return decodeField(bytes, off, { name: `[${def.di}]${def.name}`, enc: 'struct', fields: fieldsFor(def, dir), desc: `${def.name}｜${def.tier}｜${def.src}` }, end);
}

function parseUnit(bytes, off, end, kind, fi, idx) {
  const unit = { name: `信息体${idx}`, offset: off, length: 0, raw: '', value: '', desc: '', children: [] };
  let p = off;
  let stop = false;
  const push = (nd) => {
    unit.children.push(nd);
    p += nd.length;
    if (shortIn(nd)) stop = true;
  };
  if (end - off < 6) {
    const nd = rawRest(bytes, off, end, '信息体数据', '');
    nd.error = nd.desc = `剩余 ${end - off} 字节，不足 DA+DI 的 6 字节`;
    push(nd);
    unit.length = p - off;
    return { unit, stop: true };
  }
  push(daNode(bytes, p));
  const di = diAt(bytes, p);
  const def = lookupDI(di);
  const diNode = decodeField(bytes, p, { name: '数据标识编码DI', bytes: 4, enc: 'hex' });
  diNode.desc = def ? `${di}：${def.name}` : `${di}：未收录（规约未定义）`;
  push(diNode);
  unit.desc = def ? def.name : `DI ${di}（未收录）`;

  if (kind === 'result') {
    const nd = decodeField(bytes, p, { name: '确认否认', bytes: 1, enc: 'hex', enum: { '00': '确认', '01': '否认' } }, end);
    if (!nd.error && nd.value !== '00' && nd.value !== '01') nd.error = `取值 ${nd.value} 非法，应为 00 或 01`;
    push(nd);
    if (nd.error) stop = true;
  } else if (kind === 'err' || (kind === 'errOrContent' && !(def && def.up))) {
    push(errNode(bytes, p, end));
  } else if (kind === 'errOrContent') {
    push(contentNode(bytes, p, end, def, 1));
  } else if (kind === 'range6' || kind === 'range6+density') {
    push(decodeField(bytes, p, { ...TIME_DOMAIN6, name: '数据起始时间' }, end));
    if (!stop) push(decodeField(bytes, p, { ...TIME_DOMAIN6, name: '数据结束时间' }, end));
    if (!stop && kind === 'range6+density') push(decodeField(bytes, p, { name: '数据密度', bytes: 1, enc: 'hex', enum: DENSITY }, end));
  } else if (kind === 'content') {
    if (!def) {
      push(rawRest(bytes, p, end, '数据标识内容', '未收录 DI，后续无法切分'));
      stop = true;
    } else if (fieldsFor(def, fi.dir).length) push(contentNode(bytes, p, end, def, fi.dir));
  } else if (kind === 'content+time6*' || kind === 'content+time5*') {
    const tf = kind === 'content+time6*' ? TIME_DOMAIN6 : TIME_DOMAIN5;
    if (!def || typeof def.bytes !== 'number') {
      push(rawRest(bytes, p, end, '数据内容与数据时间', def ? '内容为变长结构（本期不做字段级解析），整体显示原始数据' : '未收录 DI，后续无法切分'));
      stop = true;
    } else {
      let group = 0;
      do {
        group++;
        const c = contentNode(bytes, p, end, def, fi.dir);
        if (group > 1) c.note = '按启发式切分：视为同一信息体的下一个时间点';
        push(c);
        if (!stop) push(decodeField(bytes, p, { ...tf, name: '数据时间' }, end));
      } while (!stop && end - p >= def.bytes + tf.bytes && !isKnownUnit(bytes, p, end) && !(end - p === 16 && !fi.pw));
    }
  }
  unit.length = p - off;
  return { unit, stop };
}

// design §5.3 规则 2 的补充判别：剩余字节能否恰好拆成一串已知且无错误的信息体
function cleanUnitsAt(bytes, off, end, kind, fi) {
  let p = off;
  while (p < end) {
    if (!isKnownUnit(bytes, p, end)) return false;
    const { unit, stop } = parseUnit(bytes, p, end, kind, { ...fi, pw: true }, 0);
    if (stop || hasError(unit)) return false;
    p += unit.length;
  }
  return true;
}

function parseUnits(bytes, fi) {
  const nodes = [];
  const end = fi.unitEnd;
  let off = fi.unitStart;
  const rule = AFN_RULES[fi.afn];
  if (off < end && !rule) {
    nodes.push(rawRest(bytes, off, end, '信息体区', 'AFN 规约未定义，无法拆分信息体'));
    return { nodes, rest: { offset: end, length: 0 } };
  }
  const kind = rule ? rule[fi.dir] : 'none';
  while (off < end) {
    const r = end - off;
    if (nodes.length) {
      // 规则 2：剩 16 字节且拆不成已知信息体 → 交给 parser 推断为 PW
      if (r === 16 && !fi.pw && !cleanUnitsAt(bytes, off, end, kind, fi)) break;
      // 规则 5：规约外数据，挂到上一个信息体
      if (!unitStartsAt(bytes, off, end)) {
        const last = nodes[nodes.length - 1];
        last.children.push(rawRest(bytes, off, end, '规约外数据', `规约外数据 ${r} 字节：按规约拆完后剩余，含义未知`));
        last.length += r;
        off = end;
        break;
      }
    }
    const { unit, stop } = parseUnit(bytes, off, end, kind, fi, nodes.length + 1);
    nodes.push(unit);
    off += unit.length;
    if (stop) {
      if (off < end) {
        nodes.push(rawRest(bytes, off, end, '后续数据', '前面的字段出错或长度不定，后续数据未解析'));
        off = end;
      }
      break;
    }
  }
  return { nodes, rest: { offset: off, length: end - off } };
}

// ---- parser.js ----
// 解析入口：清洗 → 帧层 → 信息体 → 附加信息（PW 推断）→ 分区、错误汇总、摘要（design.md §5.2）。任何输入都不抛异常。

// 顶层节点 → hex 视图分区；未列出的（信息体、规约外数据、后续数据等）归入 unit
const SECTION_OF = {
  '起始符68H': 'head', '长度L': 'head', '控制域C': 'ctrl', '地址域A': 'addr', '功能码AFN': 'app', '帧序列域SEQ': 'app',
  '消息验证码PW': 'aux', '时间标签Tp': 'aux', '校验码CS': 'tail', '结束符16H': 'tail', '多余数据': 'tail',
};
const EMPTY = new Uint8Array(0);

function parse(text) {
  try {
    return runParse(text);
  } catch (e) {
    const msg = `内部错误：${e && e.message ? e.message : String(e)}`;
    return { ok: false, summary: `解析有误：${msg}`, bytes: EMPTY, tree: [], errors: [msg] };
  }
}

function runParse(text) {
  const cleaned = cleanHex(text);
  if (cleaned.error) return { ok: false, summary: `解析有误：${cleaned.error}`, bytes: EMPTY, tree: [], errors: [cleaned.error] };
  const bytes = cleaned.bytes;
  if (!bytes.length) return { ok: true, summary: '', bytes, tree: [], errors: [] };
  const fi = parseFrame(bytes);
  const units = fi.fatal ? { nodes: [], rest: { offset: 0, length: 0 } } : parseUnits(bytes, fi);
  const aux = [];
  if (units.rest.length === 16) {
    const pw = decodeField(bytes, units.rest.offset, { name: '消息验证码PW', bytes: 16, enc: 'hex', order: 'be' });
    pw.desc = '消息认证码 PW';
    pw.note = '规约未要求，按长度推断';
    aux.push(pw);
  }
  if (fi.pw) aux.push(fi.pw);
  if (fi.tp) aux.push(fi.tp);
  const k = fi.nodes.findIndex((nd) => nd.name === '帧序列域SEQ');
  const tree = k < 0 ? fi.nodes : [...fi.nodes.slice(0, k + 1), ...units.nodes, ...aux, ...fi.nodes.slice(k + 1)];
  for (const nd of tree) setSection(nd, SECTION_OF[nd.name] || 'unit');
  const errors = [];
  collectErrors(tree, '', errors);
  return { ok: errors.length === 0, summary: summarize(fi, errors), bytes, tree, errors };
}

function setSection(node, section) {
  node.section = section;
  for (const c of node.children || []) setSection(c, section);
}

function collectErrors(nodes, path, out) {
  for (const nd of nodes) {
    const p = path ? `${path}/${nd.name}` : nd.name;
    if (nd.error) out.push(`${p}：${nd.error}`);
    if (nd.children) collectErrors(nd.children, p, out);
  }
}

function roleOf(fi) {
  if (fi.dir === 0) return fi.prm ? '主站请求' : '主站应答';
  if (!fi.prm) return '终端应答';
  if (fi.afn === 0x02) return '终端链路检测';
  if (fi.afn === 0x12 || fi.afn === 0x13) return '终端主动上报';
  return '终端请求';
}

function summarize(fi, errors) {
  const head = errors.length ? `解析有误（${errors.length} 处）！` : '解析成功！';
  if (fi.fatal) return `${head}报文不完整，帧头无法拆分`;
  return `${head}${roleOf(fi)}：终端地址[${fi.cid}]，主站地址[${fi.a3}]，帧序号[${fi.seq & 0x0f}]，${fi.frameKind}，${fi.afnName}`;
}

// ---- ui.js ----
// 界面：输入 → parse → 摘要行 + hex 视图 + 可折叠树表；悬停行高亮对应字节（requirements R7）。唯一接触 DOM 的模块。

const byId = (id) => document.getElementById(id);
const byteHex = (b) => b.toString(16).toUpperCase().padStart(2, '0');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderHex(res) {
  const sec = new Array(res.bytes.length).fill('none');
  const alt = new Array(res.bytes.length).fill(false);
  let unitNo = 0;
  for (const nd of res.tree) {
    if (nd.section === 'unit') unitNo++;
    for (let i = nd.offset; i < nd.offset + nd.length && i < sec.length; i++) {
      sec[i] = nd.section;
      alt[i] = nd.section === 'unit' && unitNo % 2 === 0;
    }
  }
  byId('hex').replaceChildren(...Array.from(res.bytes, (b, i) => {
    const s = el('span', `b s-${sec[i]}${alt[i] ? ' alt' : ''}`, byteHex(b));
    s.dataset.i = String(i);
    return s;
  }));
}

function hideKids(row) {
  for (const k of row.kids) {
    k.hidden = true;
    hideKids(k);
  }
}

function showKids(row) {
  for (const k of row.kids) {
    k.hidden = false;
    if (!k.collapsed) showKids(k);
  }
}

function renderTree(res) {
  const rows = [];
  const walk = (nodes, depth, parent) => {
    for (const nd of nodes) {
      const tr = el('tr', nd.error ? 'err' : '');
      tr.dataset.off = String(nd.offset);
      tr.dataset.len = String(nd.length);
      tr.kids = [];
      tr.collapsed = false;
      const hasKids = Boolean(nd.children && nd.children.length);
      const name = el('td', 'name');
      name.style.paddingLeft = `${depth * 16 + 4}px`;
      const tog = el('span', 'tog', hasKids ? '▾' : '');
      if (hasKids) {
        tog.addEventListener('click', () => {
          tr.collapsed = !tr.collapsed;
          tog.textContent = tr.collapsed ? '▸' : '▾';
          if (tr.collapsed) hideKids(tr);
          else showKids(tr);
        });
      }
      name.append(tog, document.createTextNode(`${nd.name}<${nd.length}>`));
      name.title = nd.name;
      const raw = el('td', 'raw', nd.raw);
      raw.title = nd.raw;
      const extra = [nd.note ? `〔${nd.note}〕` : '', nd.error && !(nd.desc || '').includes(nd.error) ? `【${nd.error}】` : ''];
      tr.append(name, raw, el('td', 'desc', [nd.desc, ...extra].filter(Boolean).join(' ')));
      if (parent) parent.kids.push(tr);
      rows.push(tr);
      if (hasKids) walk(nd.children, depth + 1, tr);
    }
  };
  walk(res.tree, 0, null);
  byId('tree').replaceChildren(...rows);
}

function highlight(off, len) {
  for (const s of byId('hex').children) {
    const i = Number(s.dataset.i);
    s.classList.toggle('hl', i >= off && i < off + len);
  }
}

function refresh() {
  const res = parse(byId('input').value);
  const sum = byId('summary');
  sum.textContent = res.summary;
  sum.className = res.ok ? 'summary' : 'summary bad';
  renderHex(res);
  renderTree(res);
}

function mount() {
  let timer = 0;
  byId('input').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(refresh, 150);
  });
  byId('clear').addEventListener('click', () => {
    byId('input').value = '';
    refresh();
    byId('input').focus();
  });
  const tree = byId('tree');
  tree.addEventListener('mouseover', (e) => {
    const tr = e.target.closest('tr');
    if (tr) highlight(Number(tr.dataset.off), Number(tr.dataset.len));
  });
  tree.addEventListener('mouseleave', () => highlight(0, 0));
  refresh();
}

mount();

})();
</script>
</body>
</html>
